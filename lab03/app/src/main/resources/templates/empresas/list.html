<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empresas Parceiras</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <h1>Empresas Parceiras</h1>
    <a class="btn" href="/empresas-parceiras/novo">+ Nova Empresa Parceira</a>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Login</th>
                <th>CNPJ</th>
                <th>Nome Fantasia</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="empresa : ${empresas}">
                <td th:text="${empresa.nome}"></td>
                <td th:text="${empresa.login}"></td>
                <td th:text="${empresa.cnpj}"></td>
                <td th:text="${empresa.nomeFantasia}"></td>
                <td class="acoes">
                    <a th:href="@{/empresas-parceiras/{id}/editar(id=${empresa.id})}">Editar</a>
                    &nbsp;
                    <form th:action="@{/empresas-parceiras/{id}/excluir(id=${empresa.id})}" method="post"
                          onsubmit="return confirm('Excluir esta empresa parceira?');">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
