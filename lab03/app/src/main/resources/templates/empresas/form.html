<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Empresa Parceira</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <h1 th:text="${empresa.id != null ? 'Editar Empresa Parceira' : 'Nova Empresa Parceira'}"></h1>

    <form class="form-vertical" th:action="@{/empresas-parceiras}" th:object="${empresa}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" required>

        <label for="login">Login</label>
        <input type="text" id="login" th:field="*{login}" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" th:field="*{senha}" required>

        <label for="cnpj">CNPJ</label>
        <input type="text" id="cnpj" th:field="*{cnpj}" required>

        <label for="nomeFantasia">Nome Fantasia</label>
        <input type="text" id="nomeFantasia" th:field="*{nomeFantasia}">

        <button type="submit">Salvar</button>
        <a class="btn" href="/empresas-parceiras">Cancelar</a>
    </form>
</body>
</html>
