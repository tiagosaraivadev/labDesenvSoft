<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alunos</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <h1>Alunos</h1>
    <a class="btn" href="/alunos/novo">+ Novo Aluno</a>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Login</th>
                <th>Curso</th>
                <th>Saldo de Moedas</th>
                <th>Instituição</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.nome}"></td>
                <td th:text="${aluno.login}"></td>
                <td th:text="${aluno.curso}"></td>
                <td th:text="${aluno.saldoMoedas}"></td>
                <td th:text="${aluno.instituicao != null ? aluno.instituicao.nome : '-'}"></td>
                <td class="acoes">
                    <a th:href="@{/alunos/{id}/editar(id=${aluno.id})}">Editar</a>
                    &nbsp;
                    <form th:action="@{/alunos/{id}/excluir(id=${aluno.id})}" method="post"
                          onsubmit="return confirm('Excluir este aluno?');">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
