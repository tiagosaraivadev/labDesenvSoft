<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Aluno</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <h1 th:text="${aluno.id != null ? 'Editar Aluno' : 'Novo Aluno'}"></h1>

    <form class="form-vertical"
          th:action="${aluno.id != null} ? @{/alunos/{id}/editar(id=${aluno.id})} : @{/alunos}"
          th:object="${aluno}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" required>

        <label for="login">Login</label>
        <input type="text" id="login" th:field="*{login}" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" th:field="*{senha}" th:required="${aluno.id == null}">
        <small th:if="${aluno.id != null}">Deixe em branco para manter a senha atual.</small>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" th:field="*{cpf}" required>

        <label for="rg">RG</label>
        <input type="text" id="rg" th:field="*{rg}">

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" th:field="*{endereco}">

        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}" required>

        <label for="curso">Curso</label>
        <input type="text" id="curso" th:field="*{curso}">

        <label for="instituicaoId">Instituição</label>
        <select id="instituicaoId" name="instituicaoId" required>
            <option value="">Selecione...</option>
            <option th:each="inst : ${instituicoes}"
                    th:value="${inst.id}"
                    th:text="${inst.nome}"
                    th:selected="${aluno.instituicao != null and aluno.instituicao.id == inst.id}">
            </option>
        </select>

        <p th:if="${aluno.id != null}">
            Saldo de moedas: <strong th:text="${aluno.saldoMoedas}"></strong>
            (só muda recebendo moedas de um professor ou resgatando uma vantagem —
            ver <a href="/extrato">Extrato</a>).
        </p>

        <button type="submit">Salvar</button>
        <a class="btn" href="/alunos">Cancelar</a>
    </form>
</body>
</html>
